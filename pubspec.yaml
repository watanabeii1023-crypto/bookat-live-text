name: bookat_live_text
description: >-
  On-device text recognition and Live Text selection with Apple's VisionKit
  (ImageAnalyzer / ImageAnalysisInteraction), including vertical Japanese in
  reading order, and an in-app camera. iOS 16+ (selection iOS 17+) on
  supported devices; reports "not supported" on other platforms and the web.
version: 0.2.0
publish_to: none
homepage: https://github.com/watanabeii1023-crypto/bookat-live-text

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: BookatLiveTextPlugin
      web:
        pluginClass: BookatLiveTextWeb
        fileName: bookat_live_text_web.dart
